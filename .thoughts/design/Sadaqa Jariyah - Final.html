<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Sadaqa Jariyah — sadaqajariyah.online</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500&family=DM+Sans:wght@400;500;600;700&family=DM+Mono:wght@400;500&family=Noto+Naskh+Arabic:wght@400;500&display=swap" rel="stylesheet" />
  <style>
    html, body { margin: 0; padding: 0; background: #f0eee9; }
    body { font-family: "DM Sans", -apple-system, BlinkMacSystemFont, sans-serif; }
    * { box-sizing: border-box; }
    button, input, textarea { font-family: inherit; }
  </style>

  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

  <script src="data.js"></script>
  <script type="text/babel" src="design-canvas.jsx"></script>
  <script type="text/babel" src="final.jsx"></script>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel">
    const F = window.FinalScreens;

    const screens = [
      { id: 'home',      label: 'Home',           Comp: F.Home },
      { id: 'directory', label: 'Directory',      Comp: F.Directory },
      { id: 'profile',   label: 'Public profile', Comp: F.Profile },
      { id: 'signup',    label: 'Sign up',        Comp: F.Signup },
      { id: 'login',     label: 'Log in',         Comp: F.Login },
      { id: 'edit',      label: 'Profile edit',   Comp: F.Edit },
      { id: 'owner',     label: 'Owner — empty',  Comp: F.Owner },
      { id: 'privacy',   label: 'Privacy notice', Comp: F.Privacy },
    ];

    function App() {
      return (
        <DesignCanvas>
          <DCSection
            id="final"
            title="Sadaqa Jariyah — Final"
            subtitle="Communal structure with Garden's warm sand + sage palette. sadaqajariyah.online"
          >
            {screens.map(s => (
              <DCArtboard key={s.id} id={s.id} label={s.label} width={1100} height={720}>
                <s.Comp />
              </DCArtboard>
            ))}
          </DCSection>
        </DesignCanvas>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
